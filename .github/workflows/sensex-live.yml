name: SENSEX live option chain

on:
  schedule:
    - cron: "45 3 * * 1-5"
    - cron: "45 6 * * 1-5"
  workflow_dispatch:
    inputs:
      segment:
        description: Market session to run
        type: choice
        required: true
        options: [morning, afternoon]
      run_mode:
        description: Use smoke for one connection and one sheet write, then exit
        type: choice
        required: true
        default: live
        options: [live, smoke]
      debug_ticks:
        description: Print the first five websocket ticks (manual diagnostics only)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: sensex-live-${{ github.event_name == 'workflow_dispatch' && inputs.segment || github.event.schedule == '45 3 * * 1-5' && 'morning' || 'afternoon' }}
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: |
          EXTRA_ARGS=""
          if [ "$RUN_MODE" = "smoke" ]; then EXTRA_ARGS="--once"; fi
          if [ "$DEBUG_TICKS" = "true" ]; then EXTRA_ARGS="$EXTRA_ARGS --debug-ticks"; fi
          python -m sensex_chain --segment "$SEGMENT" $EXTRA_ARGS
        env:
          SEGMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.segment || github.event.schedule == '45 3 * * 1-5' && 'morning' || 'afternoon' }}
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode || 'live' }}
          DEBUG_TICKS: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_ticks || 'false' }}
          FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
          FYERS_SECRET_KEY: ${{ secrets.FYERS_SECRET_KEY }}
          FYERS_USER_ID: ${{ secrets.FYERS_USER_ID }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
          FYERS_TOTP_SECRET: ${{ secrets.FYERS_TOTP_SECRET }}
          FYERS_REDIRECT_URI: ${{ secrets.FYERS_REDIRECT_URI }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
